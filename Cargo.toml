[package]
name = "dnsrustcon"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "DNS and subdomain reconnaissance tool: OSINT enumeration, resolution, IP enrichment, AXFR, and takeover detection"
license = "MIT"
repository = "https://github.com/abelreqma/dnsrustcon"
homepage = "https://github.com/abelreqma/dnsrustcon"
readme = "README.md"
keywords = ["dns", "subdomain", "reconnaissance", "security", "osint"]
categories = ["command-line-utilities"]
exclude = [".github/"]

[dependencies]
tokio = { version = "1", features = ["full"] }
hickory-resolver = "0.24"
hickory-proto = "0.24"
hickory-client = "0.24"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
comfy-table = "7"
owo-colors = "4"
indicatif = "0.17"
futures = "0.3"
anyhow = "1"
thiserror = "1"
toml = "0.8"
dirs = "5"
ipnet = "2"
async-trait = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
x509-parser = "0.18.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
